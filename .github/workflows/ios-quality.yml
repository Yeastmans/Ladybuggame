name: iOS quality
on:
  push:
    paths:
      - 'LadybugGame/**'
      - '.github/workflows/ios-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Generate project and app icon
        working-directory: LadybugGame
        run: |
          brew install xcodegen
          swift Scripts/generate_icon.swift Resources/Assets.xcassets/AppIcon.appiconset
          xcodegen generate
      - name: Test and capture actual game screens
        working-directory: LadybugGame
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project LadybugGame.xcodeproj -scheme LadybugGame \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath ../PolishTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../xcode-test.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d PolishTests.xcresult ]; then
            xcrun xcresulttool export attachments --path PolishTests.xcresult --output-path PolishScreenshots
          fi
      - name: Build unsigned iPhone test package
        working-directory: LadybugGame
        run: |
          set -o pipefail
          xcodebuild archive -project LadybugGame.xcodeproj -scheme LadybugGame \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ../LadybugRun.xcarchive CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../xcode-archive.log
          python3 Scripts/verify_app_bundle.py ../LadybugRun.xcarchive/Products/Applications/LadybugGame.app
          mkdir -p ../iPhoneBuild/Payload
          cp -R ../LadybugRun.xcarchive/Products/Applications/LadybugGame.app ../iPhoneBuild/Payload/
          cd ../iPhoneBuild
          zip -qr LadybugRun-unsigned.ipa Payload
          shasum -a 256 LadybugRun-unsigned.ipa > SHA256.txt
          python3 -c 'import os,json,pathlib; pathlib.Path("build-receipt.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],"workflow_run":os.environ["GITHUB_RUN_ID"],"signing":"unsigned - requires signing before installation","configuration":"Release"},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: LadybugRun-iPhone-unsigned
          retention-days: 14
          path: |
            iPhoneBuild/LadybugRun-unsigned.ipa
            iPhoneBuild/SHA256.txt
            iPhoneBuild/build-receipt.json
            LadybugRun.xcarchive/dSYMs
            LadybugGame/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-quality-results
          retention-days: 7
          path: |
            xcode-test.log
            xcode-archive.log
            PolishTests.xcresult
            PolishScreenshots
