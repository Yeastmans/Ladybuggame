workflows:
  ios-ladybug-game:
    name: iOS Ladybug Game
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_SCHEME: "LadybugGame"
      xcode: "26.2"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate app icon
        script: |
          cd LadybugGame
          swift Scripts/generate_icon.swift Resources/Assets.xcassets/AppIcon.appiconset
      - name: Generate Xcode project
        script: |
          cd LadybugGame
          xcodegen generate
      - name: Test gameplay and capture simulator screens
        script: |
          set -euo pipefail
          cd LadybugGame
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test \
            -project LadybugGame.xcodeproj \
            -scheme LadybugGame \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$CM_BUILD_DIR/PolishTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments \
            --path "$CM_BUILD_DIR/PolishTests.xcresult" \
            --output-path "$CM_BUILD_DIR/PolishScreenshots"
      - name: Archive app
        script: |
          cd LadybugGame
          xcodebuild archive \
            -project LadybugGame.xcodeproj \
            -scheme LadybugGame \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/LadybugGame.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""
      - name: Create unsigned IPA
        script: |
          set -euo pipefail
          python3 LadybugGame/Scripts/verify_app_bundle.py "$CM_BUILD_DIR/LadybugGame.xcarchive/Products/Applications/LadybugGame.app"
          mkdir -p Payload
          cp -r "$CM_BUILD_DIR/LadybugGame.xcarchive/Products/Applications/LadybugGame.app" Payload/
          # Copy icon as iTunesArtwork for sideloading tools
          if [ -f "LadybugGame/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" ]; then
            cp "LadybugGame/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" Payload/iTunesArtwork
          fi
          zip -r "$CM_BUILD_DIR/LadybugGame.ipa" Payload
          rm -rf Payload
    artifacts:
      - LadybugGame.ipa
      - PolishTests.xcresult
      - PolishScreenshots/**
      - LadybugGame.xcarchive/dSYMs/**
